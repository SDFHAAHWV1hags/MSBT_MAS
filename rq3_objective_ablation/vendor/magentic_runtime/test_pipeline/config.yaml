# ============================================================================
# Unified configuration for test_pipeline
#
#   llm                  LLMs: multi-provider registry + active selection; the three usages below can each override it
#                        (question_generation / mas multi-agent execution / validation MAST judging)
#   search               NSGA-II complete-path search parameters
#   question_generation  NLP question-generation parameters
#   sandbox              Magentic-One execution sandbox
#   mas                  Magentic-One team turn limit (must match the frozen model budget)
#   logging              unified logging
#   validation           MAST validation after MAS solving
#
# To switch models, just change the value of llm.active (a key under providers).
# ============================================================================

llm:
  # default provider (a key under providers)
  active: deepseek

  providers:
    deepseek:
      base_url: https://api.deepseek.com
      model: deepseek-flash
      api_key_env: DEEPSEEK_API_KEY     # the key is read from .env / the environment by this name
      temperature: 0.7
      max_tokens: 16000                # reasoning models spend tokens on chain-of-thought; too small and the main content gets truncated or empty
      max_retries: 2
    openai:
      base_url: https://api.openai.com/v1
      model: gpt-4o-mini
      api_key_env: OPENAI_API_KEY
      temperature: 0.7
      max_tokens: 16000
      max_retries: 2
    qwen:
      base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
      model: qwen-plus
      api_key_env: DASHSCOPE_API_KEY
      temperature: 0.7
      max_tokens: 16000
      max_retries: 2

  # three usage points: provider null means use the active provider above; other empty fields inherit the provider settings
  usages:
    question_generation:
      provider: null
      temperature: 0.7
      max_tokens: 16000
    mas:
      provider: null
      temperature: 0.0
      max_tokens: 16000
    validation:
      provider: null
      temperature: 0.0
      max_tokens: 16000        # must judge 14 patterns item by item; leave enough room to avoid truncated JSON

# ---------------------------------------------------------------------------
# Path search
# ---------------------------------------------------------------------------
search:
  num_tests: 5              # total rounds
  seed: 42
  pop_size: 40
  generations: 20
  crossover_rate: 0.80
  mutation_rate: 0.35
  max_path_len: 30
  path_gen_retries: 30
  terminal_template_weight: 0.20
  k_neighbors: 5            # neighbor count k for behavioral diversity
  beta_alpha: 1.0           # alpha of the Beta smoothing for realizability
  beta_beta: 1.0            # beta of the Beta smoothing for realizability

# ---------------------------------------------------------------------------
# Question generation
# ---------------------------------------------------------------------------
question_generation:
  n_candidates: 3           # candidate questions generated by the LLM per round
  use_llm: true             # if false, only template synthesis is used (offline)
  template_fallback: true   # whether to fall back to templates when the LLM fails

# ---------------------------------------------------------------------------
# Sandbox (Magentic-One code execution)
# ---------------------------------------------------------------------------
sandbox:
  # code execution modes:
  #   docker  executes inside a container (sandbox_dir mounted as /workspace), isolated; this is the default;
  #   local  executes directly on the host with sandbox_dir as the working directory, no Docker needed, **no isolation**,
  #          LLM-generated code runs on this machine — switch only when explicitly needed.
  mode: local
  # container image (docker mode only). mas-sandbox:latest is a self-built image with common libraries preinstalled;
  # build instructions in docker/sandbox.Dockerfile:
  #   docker build -f docker/sandbox.Dockerfile -t mas-sandbox:latest .
  # switch back to the upstream default image python:3-slim to restore a clean standard-library-only sandbox.
  image: mas-sandbox:latest
  timeout: 180              # per-execution timeout in seconds

# ---------------------------------------------------------------------------
# Multi-agent execution (Magentic-One)
# ---------------------------------------------------------------------------
mas:
  # team turn limit. The largest number of rounds actually reachable must stay within the frozen model budget; otherwise
  # the model budget runs out first and the extra rounds in the MAS log are discarded as illegal transitions by actual-path generation (num_dropped too large, path truncated).
  # autogen checks `n_rounds > max_turns`, i.e. at most max_turns+1 rounds are allowed; the frozen model
  # sets configuration_parameters.max_interactions = 16, so this value is 15 (16 rounds = the budget ceiling).
  max_turns: 15

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
logging:
  level: INFO

# ---------------------------------------------------------------------------
# Validation
# ---------------------------------------------------------------------------
validation:
  mast:
    rules: true             # rule-based judging (deterministic)
    llm_judge: true         # LLM judging (covers patterns the rules cannot decide)
